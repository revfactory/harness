name: Bug report
description: Report a defect in Harness (unexpected behavior, crash, broken install, etc.)
title: "[bug] "
labels: ["bug", "needs-triage"]
assignees:
  - revfactory
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before submitting, please skim open issues to avoid duplicates.

        **Triage SLA:** we aim to label new issues within 48h and respond substantively within 72h on business days (see [CONTRIBUTING.md](../../CONTRIBUTING.md)).

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where did you hit this bug?
      options:
        - "Claude Code"
        - "Codex"
        - "Both"
        - "Other / not sure"
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: Output of `claude --version`, Codex app version, or other relevant runtime version.
      placeholder: "Claude Code 2.x.y / Codex version / unknown"
    validations:
      required: false

  - type: dropdown
    id: experimental-flag
    attributes:
      label: Experimental Agent Teams flag state
      description: For Claude Code reports, is `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1` set in the shell where you hit this bug?
      options:
        - "Yes, flag is set to 1"
        - "No, flag is unset"
        - "N/A — Codex"
        - "I don't know"
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Commands, config, and inputs please.
      placeholder: |
        Claude Code:
        1. `/plugin marketplace add revfactory/harness`
        2. `/plugin install harness@harness-marketplace`
        3. `claude "build a harness for ..."`

        Codex:
        1. Open this repository in Codex
        2. Install `harness-codex` from the `Harness Local` marketplace
        3. `$harness Build a Codex harness for ...`
        4. observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages / stack traces verbatim.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - "macOS"
        - "Linux"
        - "Windows (WSL)"
        - "Windows (native)"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Logs, screenshots, or anything else that might help. Redact anything sensitive.
    validations:
      required: false
