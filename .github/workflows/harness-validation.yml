name: Harness validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: harness-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and skill assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository assets
        run: python scripts/validate_repository.py
